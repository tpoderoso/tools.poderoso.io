<svg xmlns="http://www.w3.org/2000/svg" width="480" height="220" viewBox="0 0 480 220">
  <style>
    .m { font-family: "Liberation Mono","Noto Sans Mono",monospace; }
    .s { font-family: "Liberation Sans","Noto Sans",sans-serif; }
    .tag { font-size: 10px; fill: #7f8bb5; }
    .nm { font-size: 11px; fill: #f8f8f2; }
    .rel { font-size: 9px; fill: #9aa0bf; }
  </style>
  <rect x="0.5" y="0.5" width="479" height="219" rx="10" fill="#191a21" stroke="#343746"/>

  <!-- pessoa -->
  <circle cx="42" cy="70" r="9" fill="none" stroke="#bd93f9" stroke-width="1.6"/>
  <rect x="30" y="83" width="24" height="28" rx="10" fill="none" stroke="#bd93f9" stroke-width="1.6"/>
  <text class="m tag" x="42" y="126" text-anchor="middle">Cliente</text>
  <text class="s tag" x="42" y="139" text-anchor="middle" font-size="8.5">[Pessoa]</text>

  <!-- boundary do sistema -->
  <rect x="96" y="26" width="368" height="150" rx="8" fill="none" stroke="#50fa7b" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text class="m tag" x="110" y="44" fill="#50fa7b">Checkout [Sistema]</text>

  <!-- Web: forma "janela" -->
  <g>
    <rect x="118" y="60" width="88" height="66" rx="8" fill="#282a36" stroke="#8be9fd" stroke-width="1.5"/>
    <line x1="118" y1="76" x2="206" y2="76" stroke="#8be9fd" stroke-width="1.3"/>
    <circle cx="130" cy="68" r="2.2" fill="#8be9fd"/>
    <circle cx="139" cy="68" r="2.2" fill="#8be9fd"/>
    <circle cx="148" cy="68" r="2.2" fill="#8be9fd"/>
    <text class="m nm" x="162" y="97" text-anchor="middle">Web</text>
    <text class="s tag" x="162" y="112" text-anchor="middle" font-size="8.5">[Container: React]</text>
  </g>

  <!-- API: forma padrão -->
  <g>
    <rect x="240" y="60" width="88" height="66" rx="6" fill="#282a36" stroke="#8be9fd" stroke-width="1.5"/>
    <text class="m nm" x="284" y="90" text-anchor="middle">API</text>
    <text class="s tag" x="284" y="105" text-anchor="middle" font-size="8.5">[Container: Node]</text>
  </g>

  <!-- Banco: cilindro -->
  <g>
    <path d="M348 76 V116 A32 8 0 0 0 412 116 V76" fill="#282a36" stroke="#8be9fd" stroke-width="1.5"/>
    <ellipse cx="380" cy="76" rx="32" ry="8" fill="#282a36" stroke="#8be9fd" stroke-width="1.5"/>
    <text class="m nm" x="380" y="104" text-anchor="middle">Banco</text>
    <text class="s tag" x="380" y="134" text-anchor="middle" font-size="7.5">[Container: Postgres]</text>
  </g>

  <!-- relações -->
  <line x1="56" y1="90" x2="118" y2="90" stroke="#9aa0bf" stroke-width="1.4" marker-end="url(#a1)"/>
  <text class="m rel" x="86" y="86" text-anchor="middle">usa</text>

  <line x1="206" y1="90" x2="240" y2="90" stroke="#9aa0bf" stroke-width="1.4" marker-end="url(#a2)"/>
  <text class="m rel" x="223" y="86" text-anchor="middle">chama</text>

  <line x1="328" y1="90" x2="348" y2="90" stroke="#9aa0bf" stroke-width="1.4" marker-end="url(#a3)"/>
  <text class="m rel" x="338" y="86" text-anchor="middle">lê/grava</text>

  <text class="s tag" x="20" y="196" font-size="9.5">O mesmo modelo também é a view de Contexto (Cliente + Checkout)</text>
  <text class="s tag" x="20" y="209" font-size="9.5">e a de Landscape — mesma informação, outro nível de zoom.</text>

  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#9aa0bf"/></marker>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#9aa0bf"/></marker>
    <marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#9aa0bf"/></marker>
  </defs>
</svg>
