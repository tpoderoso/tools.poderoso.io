    .cap { font-size: 11px; fill: #7f8bb5; }
    .lbl { font-size: 8.5px; fill: #cdd0de; }
    .chev { stroke: #44475a; stroke-width: 2; fill: none; }
  </style>
  <rect width="560" height="190" fill="none"/>

  <!-- painel 1: Panorama -->
  <g>
    <rect x="14" y="16" width="108" height="100" rx="8" fill="#191a21" stroke="#44475a" stroke-dasharray="4 3"/>
    <circle cx="34" cy="36" r="4" fill="none" stroke="#bd93f9" stroke-width="1.3"/>
    <rect x="29" y="41" width="10" height="12" rx="4" fill="none" stroke="#bd93f9" stroke-width="1.3"/>
    <rect x="52" y="30" width="60" height="20" rx="3" fill="#282a36" stroke="#50fa7b" stroke-width="1.3"/>
    <text class="m lbl" x="82" y="43" text-anchor="middle">Checkout</text>
    <rect x="52" y="60" width="60" height="20" rx="3" fill="#282a36" stroke="#50fa7b" stroke-width="1.3"/>
    <text class="m lbl" x="82" y="73" text-anchor="middle">ERP</text>
    <rect x="52" y="90" width="60" height="18" rx="3" fill="#282a36" stroke="#8290bd" stroke-width="1.3"/>
    <text class="m lbl" x="82" y="102" text-anchor="middle">Pagamento</text>
    <path d="M39 47 L52 40" stroke="#44475a" stroke-width="1"/>
    <path d="M82 50 L82 60" stroke="#44475a" stroke-width="1"/>
    <path d="M82 80 L82 90" stroke="#44475a" stroke-width="1"/>
  </g>
  <path class="chev" d="M128 66 L140 66 M134 60 L140 66 L134 72"/>

  <!-- painel 2: Contexto -->
  <g>
    <rect x="146" y="16" width="108" height="100" rx="8" fill="#191a21" stroke="#44475a" stroke-dasharray="4 3"/>
    <circle cx="166" cy="34" r="4" fill="none" stroke="#bd93f9" stroke-width="1.3"/>
    <rect x="161" y="39" width="10" height="12" rx="4" fill="none" stroke="#bd93f9" stroke-width="1.3"/>
    <rect x="168" y="58" width="66" height="26" rx="3" fill="#282a36" stroke="#50fa7b" stroke-width="1.6"/>
    <text class="m lbl" x="201" y="74" text-anchor="middle">Checkout</text>
    <rect x="184" y="96" width="52" height="18" rx="3" fill="#282a36" stroke="#8290bd" stroke-width="1.3"/>
    <text class="m lbl" x="210" y="108" text-anchor="middle">Pagamento</text>
    <path d="M171 51 L185 60" stroke="#44475a" stroke-width="1"/>
    <path d="M201 84 L210 96" stroke="#44475a" stroke-width="1"/>
