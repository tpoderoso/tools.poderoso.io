  <path class="chev" d="M260 66 L272 66 M266 60 L272 66 L266 72"/>

  <!-- painel 3: Container -->
  <g>
    <rect x="278" y="16" width="120" height="100" rx="8" fill="#191a21" stroke="#44475a" stroke-dasharray="4 3"/>
    <rect x="286" y="26" width="104" height="82" rx="6" fill="none" stroke="#44475a" stroke-dasharray="3 3"/>
    <rect x="294" y="34" width="42" height="20" rx="3" fill="#282a36" stroke="#8be9fd" stroke-width="1.3"/>
    <text class="m lbl" x="315" y="47" text-anchor="middle">Web</text>
    <rect x="294" y="62" width="42" height="20" rx="3" fill="#282a36" stroke="#8be9fd" stroke-width="1.3"/>
