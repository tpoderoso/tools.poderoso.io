    <path d="M336 44 L349 50" stroke="#44475a" stroke-width="1"/>
    <path d="M336 72 L349 66" stroke="#44475a" stroke-width="1"/>
  </g>
  <path class="chev" d="M404 66 L416 66 M410 60 L416 66 L410 72"/>

  <!-- painel 4: Componente -->
  <g>
    <rect x="422" y="16" width="124" height="100" rx="8" fill="#191a21" stroke="#44475a" stroke-dasharray="4 3"/>
    <rect x="430" y="26" width="108" height="82" rx="6" fill="none" stroke="#44475a" stroke-dasharray="3 3"/>
    <rect x="438" y="38" width="90" height="18" rx="3" fill="#282a36" stroke="#ff79c6" stroke-width="1.3"/>
    <text class="m lbl" x="483" y="50" text-anchor="middle">Pedido</text>
