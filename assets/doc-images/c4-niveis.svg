  <text class="s cap" x="68" y="132" text-anchor="middle">Panorama</text>
  <text class="s cap" x="200" y="132" text-anchor="middle">Contexto</text>
  <text class="s cap" x="338" y="132" text-anchor="middle">Container</text>
  <text class="s cap" x="484" y="132" text-anchor="middle">Componente</text>
  <text class="s" x="68" y="146" text-anchor="middle" font-size="9" fill="#7f8bb5">todos os sistemas</text>
  <text class="s" x="200" y="146" text-anchor="middle" font-size="9" fill="#7f8bb5">um sistema e vizinhos</text>
  <text class="s" x="338" y="146" text-anchor="middle" font-size="9" fill="#7f8bb5">de que partes é feito</text>
  <text class="s" x="484" y="146" text-anchor="middle" font-size="9" fill="#7f8bb5">dentro de um container</text>
